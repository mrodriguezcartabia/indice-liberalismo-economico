# Modo oscuro suave, violeta y amarillo mate. Streamlit necesita el tema base
# declarado acá; el CSS de la app afina el resto.
# Sin `headless`: con esa opción el navegador no se abre solo al arrancar.
[theme]
base = "dark"
primaryColor = "#D9B868"
backgroundColor = "#322C48"
secondaryBackgroundColor = "#3C3557"
textColor = "#F0EDF6"
font = "sans serif"
