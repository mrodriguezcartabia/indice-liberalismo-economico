# ===========================================================================
# REPLICA DEL INDEX OF ECONOMIC FREEDOM — The Heritage Foundation
#
# No es un indice propio: es el de Heritage reconstruido con este codigo, para
# poder compararlo y reponderarlo. Su metodologia declara que proveen los datos
# crudos de cada componente para que otros los estudien, ponderen e integren.
#
#   python src/build.py --config config/heritage.yaml
#
# Cada componente declara su procedencia completa. El panel de escrutinio de la
# app la lee de aca: no hay ningun texto explicativo escrito al lado del codigo.
# ===========================================================================

meta:
  sigla: "HF"
  carpeta: "heritage"
  nombre:
    es: "Índice de Libertad Económica (réplica)"
    en: "Index of Economic Freedom (replica)"
  descripcion:
    es: >
      Réplica exacta del índice publicado por The Heritage Foundation desde 1995.
      Doce componentes promediados con peso igual. Es la vara más citada en
      prensa, y el punto de partida de esta página.
    en: >
      Exact replica of the index published by The Heritage Foundation since 1995.
      Twelve components averaged with equal weight. It is the most widely cited
      benchmark in the press, and the starting point of this page.
  escala:
    es: "0 a 100. Más alto = más libertad económica según su definición."
    en: "0 to 100. Higher = more economic freedom under their definition."
  fecha_corte: "2025-06-30"
  vintage: 2026
  cobertura_minima: 0.90

  fuente:
    publicador: "The Heritage Foundation"
    dataset: "Index of Economic Freedom 2026 (32ª edición)"
    url_datos: "https://static.heritage.org/index/data/2026/2026_indexofeconomicfreedom_data.xlsx"
    url_metodologia: "https://static.heritage.org/index/pdf/2026/2026_indexofeconomicfreedom_methodology.pdf"
    url_pagina: "https://economicfreedom.heritage.org/pages/all-country-scores"
    archivo: "2026_indexofeconomicfreedom_data.xlsx"
    hoja: "ef2026"
    saltar: 1
    cobertura: "184 países listados, 176 calificados"
    nota:
      es: >
        El archivo trae país, región, puntaje total y los 12 componentes. No
        incluye insumos crudos: las ediciones anteriores a 2022 traían tasas
        impositivas, gasto y aranceles, ésta no. Dos nombres de columna tienen
        erratas del original ("Judicial Efectiveness", "Monitary Freedom") y se
        copian literalmente.
      en: >
        The file contains country, region, overall score and the 12 components.
        It carries no raw inputs: editions before 2022 included tax rates,
        spending and tariffs, this one does not. Two column names contain typos
        from the original and are copied verbatim.

  validacion:
    es: >
      El promedio simple de los 12 componentes se compara contra el puntaje
      total publicado. Diferencia máxima verificada: 0,067 puntos en 176 países,
      atribuible a redondeo.
    en: >
      The simple average of the 12 components is compared against the published
      overall score. Maximum verified difference: 0.067 points across 176
      countries, attributable to rounding.

  no_calificados:
    paises: [AFG, IRQ, LBY, LIE, SOM, SYR, UKR, YEM]
    nota:
      es: >
        Ocho países quedan sin puntaje total. Heritage no publica en su
        metodología el criterio por el cual se los excluye.
      en: >
        Eight countries have no overall score. Heritage does not publish in its
        methodology the criterion by which they are excluded.

# ---------------------------------------------------------------------------
# Los cuatro grupos de Heritage. Su peso de 25% NO es una decisión declarada:
# es consecuencia de haber agrupado los 12 componentes de a tres.
# ---------------------------------------------------------------------------
pilares:
  estado_de_derecho:
    titulo: {es: "Estado de derecho", en: "Rule of Law"}
  tamano_estado:
    titulo: {es: "Tamaño del Estado", en: "Government Size"}
  eficiencia_regulatoria:
    titulo: {es: "Eficiencia regulatoria", en: "Regulatory Efficiency"}
  mercados_abiertos:
    titulo: {es: "Mercados abiertos", en: "Open Markets"}
  restricciones_externas:
    titulo: {es: "Restricciones adicionales", en: "Additional restrictions"}
    externo: true
    descripcion:
      es: >
        Restricciones legales que Heritage sólo considera de manera
        cualitativa, dentro de Libertad de inversión y Libertad financiera.
        Este pilar arranca en cero.
      en: >
        Legal restrictions that Heritage only considers qualitatively, within
        Investment Freedom and Financial Freedom. This pillar starts at zero.
  propiedad_estatal:
    titulo: {es: "Propiedad estatal", en: "State ownership"}
    externo: true
    descripcion:
      es: >
        Heritage no incluye ningún componente que mida qué posee el Estado
        dentro de la economía. Este pilar arranca en cero: subirlo agrega una
        dimensión que el índice original no tiene.
      en: >
        Heritage includes no component measuring what the state owns within the
        economy. This pillar starts at zero: raising it adds a dimension the
        original index does not have.

# ---------------------------------------------------------------------------
# `reproducible` clasifica cada componente segun se pueda o no recalcular desde
# datos publicos. La app lo muestra al visitante.
#   total    formula publicada + insumos publicados
#   parcial  formula publicada, pero incluye un descuento discrecional no publicado
#   fuentes  reconstruible desde fuentes de terceros, con trabajo
#   ninguna  asignado por criterio del analista, sin insumo auditable
# ---------------------------------------------------------------------------
componentes:

  hf_property_rights:
    significa_100: {es: "propiedad segura y bien protegida", en: "secure, well-protected property"}
    subfactores:
      n: 3
      verificado: false
      detalle: "Credendo · US Chamber IP Index · World Bank WGI"
    pilar: estado_de_derecho
    puntos: 10
    titulo: {es: "Derechos de propiedad", en: "Property Rights"}
    definicion:
      es: >
        Mide si el marco legal permite adquirir, mantener y usar propiedad
        privada, y si esas leyes se hacen cumplir. Mide la seguridad de los
        derechos, no la distribución de la propiedad.
      en: >
        Measures whether the legal framework allows acquiring, holding and using
        private property, and whether those laws are enforced. It measures the
        security of rights, not the distribution of ownership.
    fuente:
      columna: "Property Rights"
      insumos: "Credendo Country Risk · US Chamber International IP Index · World Bank Worldwide Governance Indicators"
    reproducible: fuentes
    direccion: mas_es_mas_libre
    normalizacion: {tipo: escala_fija, min: 0, max: 100}

  hf_judicial_effectiveness:
    significa_100: {es: "justicia independiente y eficaz", en: "independent, effective courts"}
    subfactores:
      n: 2
      verificado: false
      detalle: "Freedom House · World Bank WGI"
    pilar: estado_de_derecho
    puntos: 10
    titulo: {es: "Efectividad judicial", en: "Judicial Effectiveness"}
    definicion:
      es: "Independencia judicial y calidad del proceso legal."
      en: "Judicial independence and quality of the legal process."
    fuente:
      columna: "Judicial Efectiveness"
      insumos: "Freedom House Freedom in the World · World Bank WGI"
      nota_columna: {es: "errata en el original", en: "typo in the original"}
    reproducible: fuentes
    direccion: mas_es_mas_libre
    normalizacion: {tipo: escala_fija, min: 0, max: 100}

  hf_government_integrity:
    significa_100: {es: "corrupción nula", en: "no corruption"}
    subfactores:
      n: 3
      verificado: false
      detalle: "Transparency International · TRACE · World Bank WGI"
    pilar: estado_de_derecho
    puntos: 10
    titulo: {es: "Integridad del gobierno", en: "Government Integrity"}
    definicion:
      es: "Percepción de corrupción y soborno. Basado en encuestas de expertos."
      en: "Perception of corruption and bribery. Based on expert surveys."
    fuente:
      columna: "Government Integrity"
      insumos: "Transparency International CPI · TRACE Bribery Risk Matrix · World Bank WGI"
    reproducible: fuentes
    direccion: mas_es_mas_libre
    normalizacion: {tipo: escala_fija, min: 0, max: 100}

  hf_tax_burden:
    significa_100: {es: "impuestos cero", en: "zero taxes"}
    subfactores:
      n: 3
      verificado: true
      detalle: "Alícuota máxima personal · alícuota máxima corporativa · recaudación sobre PBI"
    pilar: tamano_estado
    puntos: 10
    titulo: {es: "Carga tributaria", en: "Tax Burden"}
    definicion:
      es: >
        Promedio de tres subfactores: alícuota máxima del impuesto a las
        ganancias personales, alícuota máxima corporativa, y recaudación total
        sobre PBI. No incluye aportes obligatorios a la seguridad social.
      en: >
        Average of three sub-factors: top marginal personal income tax rate, top
        corporate rate, and total tax revenue over GDP. Mandatory social security
        contributions are not included.
    formula: "100 − 0,03 · x²  (promedio de los tres subfactores)"
    fuente:
      columna: "Tax Burden"
      insumos: "KPMG · Deloitte · PwC Worldwide Tax Summaries · World Bank WDI · OCDE · Eurostat · FMI"
    reproducible: total
    direccion: mas_es_mas_libre
    normalizacion: {tipo: escala_fija, min: 0, max: 100}

  hf_government_spending:
    significa_100: {es: "gasto público cero", en: "zero government spending"}
    subfactores:
      n: 1
      verificado: true
      detalle: "Gasto público sobre PBI, promedio de tres años"
    pilar: tamano_estado
    puntos: 10
    titulo: {es: "Gasto público", en: "Government Spending"}
    definicion:
      es: >
        Gasto público total sobre PBI, promedio de tres años. Mide flujo
        presupuestario, no patrimonio: los activos que posee el Estado no entran.
      en: >
        Total government spending over GDP, three-year average. It measures
        budget flow, not assets: state-owned assets do not enter.
    formula: "100 − 0,03 · G²  (G = gasto/PBI, promedio 3 años)"
    fuente:
      columna: "Government Spending"
      insumos: "FMI World Economic Outlook · OCDE · Eurostat · BAfD · BAD · CEPAL"
    reproducible: total
    direccion: mas_es_mas_libre
    normalizacion: {tipo: escala_fija, min: 0, max: 100}

  hf_fiscal_health:
    significa_100: {es: "sin déficit ni deuda", en: "no deficit, no debt"}
    subfactores:
      n: 2
      verificado: true
      pesos: [0.8, 0.2]
      detalle: "Déficit fiscal (80%) · deuda pública (20%)"
      nota:
        es: >
          Es el único componente con ponderación interna desigual
          declarada, dentro de un índice que promedia sus componentes
          con peso igual.
        en: >
          It is the only component with a declared unequal internal
          weighting, inside an index that averages its components with
          equal weight.
    pilar: tamano_estado
    puntos: 10
    titulo: {es: "Salud fiscal", en: "Fiscal Health"}
    definicion:
      es: "Déficit y deuda pública. Es un resultado fiscal, no una libertad."
      en: "Deficit and public debt. It is a fiscal outcome, not a freedom."
    formula: "0,8 · (100 − 2·D²) + 0,2 · (100 − 0,01·B²)"
    fuente:
      columna: "Fiscal Health"
      insumos: "FMI World Economic Outlook"
    reproducible: total
    direccion: mas_es_mas_libre
    normalizacion: {tipo: escala_fija, min: 0, max: 100}

  hf_business_freedom:
    significa_100: {es: "operar una empresa es fácil y barato", en: "running a business is easy and cheap"}
    subfactores:
      n: 4
      verificado: true
      detalle: "Acceso a electricidad · riesgo del entorno de negocios · calidad regulatoria · inclusión económica de la mujer"
    pilar: eficiencia_regulatoria
    puntos: 10
    titulo: {es: "Libertad de empresa", en: "Business Freedom"}
    definicion:
      es: >
        Cuatro subfactores con peso igual: acceso a electricidad, riesgo del
        entorno de negocios, calidad regulatoria e inclusión económica de la
        mujer. El acceso a electricidad es un indicador de infraestructura.
      en: >
        Four equally weighted sub-factors: access to electricity, business
        environment risk, regulatory quality and women's economic inclusion.
        Access to electricity is an infrastructure indicator.
    fuente:
      columna: "Business Freedom"
      insumos: "World Bank WGI y WDI · Credendo · World Bank Women, Business and the Law"
    reproducible: fuentes
    direccion: mas_es_mas_libre
    normalizacion: {tipo: escala_fija, min: 0, max: 100}

  hf_labor_freedom:
    significa_100: {es: "mercado laboral sin regulación", en: "unregulated labor market"}
    subfactores:
      n: 9
      verificado: true
      detalle: "Nueve subfactores, incluidos productividad laboral y tasa de participación"
    pilar: eficiencia_regulatoria
    puntos: 10
    titulo: {es: "Libertad laboral", en: "Labor Freedom"}
    definicion:
      es: >
        Nueve subfactores con peso igual, entre ellos la productividad laboral y
        la tasa de participación, que son resultados y no reglas.
      en: >
        Nine equally weighted sub-factors, including labor productivity and the
        participation rate, which are outcomes rather than rules.
    fuente:
      columna: "Labor Freedom"
      insumos: "World Bank WGI y WDI · Freedom House · OIT · World Bank Employing Workers"
    reproducible: fuentes
    direccion: mas_es_mas_libre
    normalizacion: {tipo: escala_fija, min: 0, max: 100}

  hf_monetary_freedom:
    significa_100: {es: "inflación cero y sin controles de precios", en: "zero inflation, no price controls"}
    subfactores:
      n: 2
      verificado: true
      detalle: "Inflación ponderada de tres años · penalización por controles de precios"
    pilar: eficiencia_regulatoria
    puntos: 10
    titulo: {es: "Libertad monetaria", en: "Monetary Freedom"}
    definicion:
      es: >
        Inflación ponderada de tres años, menos una penalización por controles
        de precios de hasta 20 puntos que Heritage no publica por país.
      en: >
        Three-year weighted inflation, minus a price-control penalty of up to 20
        points which Heritage does not publish by country.
    formula: "100 − 6,333·√(inflación ponderada) − penalización  ·  pesos 0,665 / 0,245 / 0,090"
    fuente:
      columna: "Monitary Freedom"
      insumos: "FMI International Financial Statistics · FMI World Economic Outlook"
      nota_columna: {es: "errata en el original", en: "typo in the original"}
    reproducible: parcial
    direccion: mas_es_mas_libre
    normalizacion: {tipo: escala_fija, min: 0, max: 100}

  hf_trade_freedom:
    significa_100: {es: "aranceles cero y sin barreras", en: "zero tariffs, no barriers"}
    subfactores:
      n: 2
      verificado: true
      detalle: "Arancel promedio ponderado · penalización por barreras no arancelarias"
    pilar: mercados_abiertos
    puntos: 10
    titulo: {es: "Libertad comercial", en: "Trade Freedom"}
    definicion:
      es: >
        Arancel promedio ponderado, menos una penalización por barreras no
        arancelarias que Heritage no publica por país. Entre esas barreras
        considera el número de medidas notificadas a la OMC.
      en: >
        Weighted average tariff, minus a non-tariff barrier penalty which
        Heritage does not publish by country. Among those barriers it considers
        the number of measures notified to the WTO.
    formula: "100 · (50 − arancel) / 50 − penalización"
    fuente:
      columna: "Trade Freedom"
      insumos: "OMC World Tariff Profiles · World Bank WDI · USTR National Trade Estimate"
    reproducible: parcial
    direccion: mas_es_mas_libre
    normalizacion: {tipo: escala_fija, min: 0, max: 100}

  hf_investment_freedom:
    significa_100: {es: "sin restricciones al movimiento de capitales", en: "no restrictions on capital movement"}
    subfactores:
      n: 1
      verificado: true
      detalle: "Puntaje único asignado por evaluación cualitativa"
    pilar: mercados_abiertos
    puntos: 10
    titulo: {es: "Libertad de inversión", en: "Investment Freedom"}
    definicion:
      es: >
        Arranca en 100 y se descuentan 5, 10, 15, 20 o 25 puntos según
        evaluación cualitativa. Entre los descuentos hay restricciones a la
        compra de inmuebles, todas referidas a compradores extranjeros: que el
        Estado sea propietario del suelo no descuenta puntos.
      en: >
        Starts at 100 and 5, 10, 15, 20 or 25 points are deducted based on
        qualitative assessment. Deductions include restrictions on real estate
        purchases, all referring to foreign buyers: state ownership of land
        deducts no points.
    fuente:
      columna: "Investment Freedom"
      insumos: "US State Dept Investment Climate Statements · USTR · OCDE · FMI Artículo IV"
    reproducible: ninguna
    direccion: mas_es_mas_libre
    normalizacion: {tipo: escala_fija, min: 0, max: 100}

  hf_financial_freedom:
    significa_100: {es: "participación estatal mínima en el sector financiero", en: "minimal state share of the financial sector"}
    subfactores:
      n: 1
      verificado: true
      detalle: "Puntaje único asignado en escalones de diez"
    pilar: mercados_abiertos
    puntos: 10
    titulo: {es: "Libertad financiera", en: "Financial Freedom"}
    definicion:
      es: >
        Puntajes asignados en escalones de 10 según criterio. Cada escalón se
        define en parte por la participación del Estado en los activos del
        sector financiero: es el único lugar del índice donde la propiedad
        estatal se considera, y de manera cualitativa.
      en: >
        Scores assigned in steps of 10 by judgment. Each step is defined partly
        by the state's share of financial sector assets: it is the only place in
        the index where state ownership is considered, and qualitatively.
    fuente:
      columna: "Financial Freedom"
      insumos: "FMI Artículo IV · OCDE Economic Surveys · bancos centrales"
    reproducible: ninguna
    direccion: mas_es_mas_libre
    normalizacion: {tipo: escala_fija, min: 0, max: 100}

  z_propiedad_estatal:
    significa_100: {es: "el Estado no posee nada de la economía", en: "the state owns nothing in the economy"}
    pilar: propiedad_estatal
    puntos: 0
    externo: true
    titulo: {es: "Propiedad estatal de la economía", en: "State ownership of the economy"}
    definicion:
      es: >
        Extensión de la propiedad del Estado sobre la economía. No forma parte
        del índice de Heritage: ninguno de sus doce componentes mide esta
        dimensión. La única consideración aparece dentro de Libertad financiera,
        de manera cualitativa.
      en: >
        Extent of state ownership over the economy. It is not part of the
        Heritage index: none of its twelve components measures this dimension.
        The only consideration appears within Financial Freedom, qualitatively.
    fuente:
      columna: "IE State ownership"
      publicador: "Fraser Institute"
      dataset: "Economic Freedom of the World 2026"
      url: "https://www.fraserinstitute.org/economic-freedom/dataset"
      insumos: "V-Dem, variable v2clstown"
      escala_original: "0–10, 10 = menos Estado"
      cobertura: "162 países, hasta 2024"
    reproducible: fuentes
    alinear_al_vintage: true
    direccion: mas_es_mas_libre
    normalizacion: {tipo: escala_fija, min: 0, max: 10}

  z_inversion_publica:
    significa_100: {es: "toda la inversión es privada", en: "all investment is private"}
    pilar: propiedad_estatal
    puntos: 0
    externo: true
    titulo: {es: "Inversión pública", en: "Government investment"}
    definicion:
      es: >
        Inversión del gobierno como proporción de la inversión total. Mide cuánto del capital que se forma en la economía lo decide el Estado.
      en: >
        Government investment as a share of total investment. It measures how much of the capital formed in the economy is decided by the state.
    fuente:
      columna: "1C  Government investment"
      publicador: "Fraser Institute"
      dataset: "Economic Freedom of the World 2026"
      url: "https://www.fraserinstitute.org/economic-freedom/dataset"
      escala_original: "0–10, 10 = menos Estado"
      cobertura: "161 países, hasta 2024"
      advertencia:
        es: >
          El índice de Heritage no incluye ningún componente que mida esto.
        en: >
          The Heritage index includes no component measuring this.
    reproducible: fuentes
    alinear_al_vintage: true
    direccion: mas_es_mas_libre
    normalizacion: {tipo: escala_fija, min: 0, max: 10}

  z_controles_capital:
    significa_100: {es: "sin controles de capital", en: "no capital controls"}
    pilar: restricciones_externas
    puntos: 0
    externo: true
    titulo: {es: "Controles de capital", en: "Capital controls"}
    definicion:
      es: >
        Restricciones legales al movimiento de capitales, según la cantidad de categorías con controles en el informe AREAER del FMI. Heritage lo considera dentro de Libertad de inversión, con descuentos cualitativos de 5, 10 o 15 puntos.
      en: >
        Legal restrictions on capital movement, based on the number of categories with controls in the IMF AREAER report. Heritage considers it within Investment Freedom, with qualitative deductions of 5, 10 or 15 points.
    fuente:
      columna: "4Dii  Capital controls"
      publicador: "Fraser Institute"
      dataset: "Economic Freedom of the World 2026"
      url: "https://www.fraserinstitute.org/economic-freedom/dataset"
      escala_original: "0–10, 10 = menos Estado"
      cobertura: "165 países, hasta 2024"
      advertencia:
        es: >
          El índice de Heritage no incluye ningún componente que mida esto.
        en: >
          The Heritage index includes no component measuring this.
    reproducible: fuentes
    alinear_al_vintage: true
    direccion: mas_es_mas_libre
    normalizacion: {tipo: escala_fija, min: 0, max: 10}

  z_regulacion_credito:
    significa_100: {es: "crédito privado, sin bancos estatales ni topes de tasa", en: "private credit, no state banks, no rate caps"}
    pilar: restricciones_externas
    puntos: 0
    externo: true
    titulo: {es: "Regulación del crédito", en: "Credit market regulation"}
    definicion:
      es: >
        Propiedad estatal de los bancos, crédito absorbido por el sector público y controles de tasas de interés. Heritage lo trata dentro de Libertad financiera, con puntajes asignados en escalones de diez.
      en: >
        State ownership of banks, credit absorbed by the public sector and interest rate controls. Heritage treats it within Financial Freedom, with scores assigned in steps of ten.
    fuente:
      columna: "5A  Credit market regulation"
      publicador: "Fraser Institute"
      dataset: "Economic Freedom of the World 2026"
      url: "https://www.fraserinstitute.org/economic-freedom/dataset"
      escala_original: "0–10, 10 = menos Estado"
      cobertura: "164 países, hasta 2024"
      advertencia:
        es: >
          El índice de Heritage no incluye ningún componente que mida esto.
        en: >
          The Heritage index includes no component measuring this.
    reproducible: fuentes
    alinear_al_vintage: true
    direccion: mas_es_mas_libre
    normalizacion: {tipo: escala_fija, min: 0, max: 10}

  z_consumo_publico:
    significa_100: {es: "consumo del gobierno cero", en: "zero government consumption"}
    pilar: tamano_estado
    puntos: 0
    externo: true
    titulo: {es: "Consumo público", en: "Government consumption"}
    definicion:
      es: >
        Consumo del gobierno como proporción del consumo total. Es distinto
        del gasto público de Heritage, que incluye inversión y transferencias:
        la correlación medida entre ambos es 0,649.
      en: >
        Government consumption as a share of total consumption. It differs
        from Heritage's government spending, which includes investment and
        transfers: their measured correlation is 0.649.
    fuente:
      columna: "1A Government consumption"
      publicador: "Fraser Institute"
      dataset: "Economic Freedom of the World 2026"
      url: "https://www.fraserinstitute.org/economic-freedom/dataset"
      escala_original: "0–10, 10 = menos Estado"
      cobertura: "165 países, hasta 2024"
    reproducible: fuentes
    alinear_al_vintage: true
    direccion: mas_es_mas_libre
    normalizacion: {tipo: escala_fija, min: 0, max: 10}

  ocde_presion_fiscal:
    significa_100: {es: "recaudación cero", en: "zero tax revenue"}
    pilar: tamano_estado
    puntos: 0
    externo: true
    titulo: {es: "Presión fiscal", en: "Tax revenue"}
    definicion:
      es: >
        Recaudación tributaria total del gobierno general sobre PBI, incluidas
        las contribuciones a la seguridad social. A diferencia de la carga
        tributaria de Heritage, no mezcla alícuotas máximas con recaudación.
      en: >
        Total general government tax revenue over GDP, including social security
        contributions. Unlike Heritage's tax burden, it does not mix top rates
        with revenue.
    formula: "100 − 0,03 · x²  (x = recaudación/PBI, misma forma que Heritage)"
    fuente:
      serie: "Total tax revenue, general government (S13), % of GDP"
      publicador: "OCDE"
      dataset: "Global Revenue Statistics Database (OECD.CTP.TPS, DF_RSGLOBAL)"
      url: "https://sdmx.oecd.org/public/rest/data/OECD.CTP.TPS,DSD_REV_COMP_GLOBAL@DF_RSGLOBAL,/.TAX_REV.S13._T._T.PT_B1GQ.A"
      cobertura: "142 países, 1990–2024"
      descarga: "automática: python src/descargar.py ocde_presion_fiscal"
    reproducible: total
    alinear_al_vintage: true
    direccion: menos_es_mas_libre
    normalizacion: {tipo: cuadratica, alpha: 0.03}

  fmi_gasto_publico:
    significa_100: {es: "gasto público cero", en: "zero government spending"}
    pilar: tamano_estado
    puntos: 0
    externo: true
    titulo: {es: "Gasto público (FMI)", en: "Government expenditure (IMF)"}
    definicion:
      es: >
        Gasto total del gobierno general sobre PBI, último año observado. Es el
        mismo dato que Heritage promedia en tres años para su componente de
        gasto público.
      en: >
        Total general government expenditure over GDP, latest observed year.
        It is the same data Heritage averages over three years for its
        government spending component.
    formula: "100 − 0,03 · x²  (x = gasto/PBI, misma forma que Heritage)"
    fuente:
      serie: "GGX_NGDP — General government total expenditure, % of GDP"
      publicador: "Fondo Monetario Internacional"
      dataset: "World Economic Outlook (IMF.RES:WEO)"
      url: "https://data.imf.org/en/datasets/IMF.RES:WEO"
      cobertura: "197 países, 1980–2025, sin proyecciones"
      descarga: "automática: python src/descargar.py fmi_gasto_publico"
    reproducible: total
    alinear_al_vintage: true
    direccion: menos_es_mas_libre
    normalizacion: {tipo: cuadratica, alpha: 0.03}

  z_entrada_mercados:
    significa_100: {es: "entrada a los mercados sin trabas", en: "unobstructed market entry"}
    pilar: eficiencia_regulatoria
    puntos: 0
    externo: true
    titulo: {es: "Libertad de entrada a mercados", en: "Freedom to enter markets"}
    definicion:
      es: >
        Apertura de mercados, permisos para operar y distorsiones al entorno de negocios.
      en: >
        Market openness, business permits and distortions of the business environment.
    fuente:
      columna: "5D Freedom to enter markets and compete"
      publicador: "Fraser Institute"
      dataset: "Economic Freedom of the World 2026"
      url: "https://www.fraserinstitute.org/economic-freedom/dataset"
      escala_original: "0–10, 10 = menos Estado"
      cobertura: "165 países, hasta 2024"
    reproducible: fuentes
    alinear_al_vintage: true
    direccion: mas_es_mas_libre
    normalizacion: {tipo: escala_fija, min: 0, max: 10}

# ---------------------------------------------------------------------------
# Dos componentes se consideran superpuestos (miden casi lo mismo) cuando su
# correlación, calculada por build.py sobre todos los países y años, es mayor
# o igual a este umbral. Con los dos activos, la app muestra un aviso.
# ---------------------------------------------------------------------------
umbral_superposicion: 0.9

# ---------------------------------------------------------------------------
# Orden de los componentes dentro del código compartible (src/codigo.py).
# Es independiente del orden en pantalla. Un componente nuevo se agrega SIEMPRE
# al principio de esta lista: así los códigos ya publicados se siguen leyendo
# igual, con el componente nuevo en cero. build.py falla si falta alguno.
# ---------------------------------------------------------------------------
orden_codigo: [fmi_gasto_publico, ocde_presion_fiscal,
               hf_property_rights, hf_judicial_effectiveness,
               hf_government_integrity, hf_tax_burden, hf_government_spending,
               hf_fiscal_health, hf_business_freedom, hf_labor_freedom,
               hf_monetary_freedom, hf_trade_freedom, hf_investment_freedom,
               hf_financial_freedom, z_propiedad_estatal, z_inversion_publica,
               z_controles_capital, z_regulacion_credito, z_consumo_publico,
               z_entrada_mercados]

# ---------------------------------------------------------------------------
# Eje vertical del grafico de dispersion. NO entra al puntaje.
# Se construye con los propios componentes de Estado de derecho de Heritage.
# ---------------------------------------------------------------------------
eje_cumplimiento:
  titulo: {es: "Estado de derecho", en: "Rule of law"}
  definicion:
    es: >
      Promedio de los tres componentes de Estado de derecho de Heritage. Se usa
      como segundo eje porque un Estado pequeño donde los contratos no se
      cumplen no es lo mismo que un Estado pequeño donde sí se cumplen.
    en: >
      Average of Heritage's three rule of law components. Used as a second axis
      because a small state where contracts go unenforced is not the same as a
      small state where they are enforced.
  componentes:
    - {serie: hf_property_rights, peso: 0.3333, direccion: mas_es_mas_libre, normalizacion: {tipo: escala_fija, min: 0, max: 100}}
    - {serie: hf_judicial_effectiveness, peso: 0.3333, direccion: mas_es_mas_libre, normalizacion: {tipo: escala_fija, min: 0, max: 100}}
    - {serie: hf_government_integrity, peso: 0.3334, direccion: mas_es_mas_libre, normalizacion: {tipo: escala_fija, min: 0, max: 100}}

# ---------------------------------------------------------------------------
# Ponderaciones guardadas. La de Heritage es una mas del mismo espacio.
# ---------------------------------------------------------------------------
presets:
  heritage:
    nombre: {es: "Heritage", en: "Heritage"}
    corto: {es: "Heritage", en: "Heritage"}
    descripcion:
      es: >
        La ponderación oficial: los doce componentes con diez puntos cada uno.
        Como cada categoría agrupa tres componentes, las cuatro terminan
        pesando 25%. Ese 25% no es una decisión declarada: es consecuencia de
        cuántos componentes tiene cada una.
      en: >
        The official weighting: the twelve components with ten points each.
        Since each category groups three components, all four end up weighing
        25%. That 25% is not a declared decision: it follows from how many
        components each one has.
    puntos: {hf_property_rights: 10,
             hf_judicial_effectiveness: 10,
             hf_government_integrity: 10,
             hf_tax_burden: 10,
             hf_government_spending: 10,
             hf_fiscal_health: 10,
             hf_business_freedom: 10,
             hf_labor_freedom: 10,
             hf_monetary_freedom: 10,
             hf_trade_freedom: 10,
             hf_investment_freedom: 10,
             hf_financial_freedom: 10,
             z_propiedad_estatal: 0,
             z_inversion_publica: 0,
             z_controles_capital: 0,
             z_regulacion_credito: 0,
             z_consumo_publico: 0,
             z_entrada_mercados: 0,
             ocde_presion_fiscal: 0,
             fmi_gasto_publico: 0}
  liberalismo:
    nombre:
      es: "Índice de Liberalismo económico"
      en: "Economic Liberalism Index"
    corto: {es: "Liberalismo", en: "Liberalism"}
    descripcion:
      es: >
        Trece componentes con el mismo peso: siete de Heritage y seis de
        Fraser. De Heritage deja fuera los cinco que no miden reglas: integridad
        del gobierno y las libertades de inversión y financiera por ser
        evaluaciones cualitativas; libertad de empresa porque mide desarrollo;
        y libertad laboral porque su fórmula compara contra el promedio mundial
        y produce resultados que no se sostienen. De Fraser suma los
        componentes que miden la presencia del Estado y que el índice de
        Heritage no tiene; quedaron fuera tres que se superponían con
        componentes de Heritage.
        Derechos de propiedad y eficacia judicial tienen una correlación mayor
        a 0,9: miden casi lo mismo, y la página lo advierte porque con los dos
        activos esa dimensión pesa el doble.
      en: >
        Thirteen equally weighted components: seven from Heritage and six from
        Fraser. From Heritage it leaves out the five that do not measure rules:
        government integrity and investment and financial freedom, being
        qualitative assessments; business freedom, which measures development;
        and labor freedom, whose formula compares against the world average.
        From Fraser it adds the components measuring state presence that the
        Heritage index lacks; three that overlapped with Heritage components
        were left out.
        Property rights and judicial effectiveness have a correlation above
        0.9: they measure almost the same thing, and the page flags it because
        with both active that dimension weighs twice.
    puntos: {hf_property_rights: 10,
             hf_judicial_effectiveness: 10,
             hf_government_integrity: 0,
             hf_tax_burden: 10,
             hf_government_spending: 10,
             hf_fiscal_health: 10,
             hf_business_freedom: 0,
             hf_labor_freedom: 0,
             hf_monetary_freedom: 10,
             hf_trade_freedom: 10,
             hf_investment_freedom: 0,
             hf_financial_freedom: 0,
             z_propiedad_estatal: 10,
             z_inversion_publica: 10,
             z_controles_capital: 10,
             z_regulacion_credito: 10,
             z_consumo_publico: 10,
             z_entrada_mercados: 10,
             ocde_presion_fiscal: 0,
             fmi_gasto_publico: 0}

solo_reportadas:
  hf_overall:
    titulo: {es: "Puntaje total publicado", en: "Published overall score"}
    columna: "Overall Score"
